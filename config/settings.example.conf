# Pipeline settings. This file is the template; copy it to settings.conf
# before changing values:
#   cp config/settings.example.conf config/settings.conf
# settings.conf is gitignored — your values stay local.
#
# Override hierarchy: env vars > settings.conf > script-level fallback.
# (Setting a var here only fills it in if not already set in your shell, so
# `MODEL=foo ./run.sh` still wins for one-off tweaks.)
#
# This file is sourced by Bash, so it must be valid Bash syntax. Do not
# add code beyond `: "${VAR:=value}"` lines — that pattern sets VAR only
# when unset and is the convention used here.

# ===========================================================================
# Common settings — adjust these to match your hardware and preferences.
# See README "Hardware sizing" for guidance on choosing models per RAM tier.
# ===========================================================================

# Whisper.cpp model file. Download from
#   https://huggingface.co/ggerganov/whisper.cpp
: "${MODEL_PATH:=$HOME/source/external/whisper_models/ggml-large-v3.bin}"

# Ollama model tag (after `ollama pull <tag>`).
: "${MODEL:=qwen2.5:32b-instruct-q4_K_M}"

# Total context window for Ollama (input + output tokens). Drop to 32768 or
# 16384 if you hit out-of-memory; raise if your sessions exceed ~3.5 hours.
: "${NUM_CTX:=65536}"

# Where Ollama is listening. Change if you remote-host it.
: "${OLLAMA_URL:=http://localhost:11434}"

# Stage 4 (summarize) sampling temperature. Lower = more faithful extraction.
: "${SUMMARIZE_TEMPERATURE:=0.3}"

# Refine pass sampling temperature.
: "${REFINE_TEMPERATURE:=0.2}"

# Stage 3 (cleaner) low-confidence-token threshold. Tokens with whisper
# probability below this get a [?] marker in the cleaned text.
: "${CONFIDENCE_THRESHOLD:=0.5}"

# ===========================================================================
# Advanced — only touch if you know what you're doing. These tune the
# whisper.cpp decoder and ffmpeg silence trim. Defaults are tested against
# multi-hour TTRPG recordings; changing them risks worse transcription
# quality, repetition loops, or trimmed dialogue.
# ===========================================================================

# Stage 1 — ffmpeg trailing-silence trim parameters.
# SILENCE_THRESHOLD: anything quieter counts as silence (-40dB default).
# SILENCE_DURATION:  seconds of contiguous silence required before trimming.
: "${SILENCE_THRESHOLD:=-40dB}"
: "${SILENCE_DURATION:=10}"

# Stage 2 — whisper.cpp decoder thresholds.
# WORD_THRESHOLD:    confidence required to emit a timestamp boundary.
# ENTROPY_THRESHOLD: above this, decode is declared failed and falls back.
# TEMPERATURE_INC:   temperature step on each fallback retry.
# THREADS:           CPU thread count (Metal handles the heavy work on
#                    Apple Silicon; this mostly affects pre/post stages).
: "${WORD_THRESHOLD:=0.95}"
: "${ENTROPY_THRESHOLD:=3.0}"
: "${TEMPERATURE_INC:=0.5}"
: "${THREADS:=8}"

# Stage 3 — sliding-window line-level dedupe distance for repetition-loop
# residue. Bump to 16 if longer-cycle loops get through; lower to 4 if
# legitimate repetition is being eaten.
: "${DEDUPE_WINDOW:=8}"
